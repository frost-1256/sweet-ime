[package]
name = "sweet-installer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Graphical installer for Sweet IME"

[[bin]]
name = "sweet-setup"
path = "src/main.rs"

[dependencies]
sweet-ui = { path = "../ui" }
miniz_oxide = "0.9"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
