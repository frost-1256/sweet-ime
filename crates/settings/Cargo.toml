[package]
name = "sweet-settings"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Settings app for Sweet IME"

[[bin]]
name = "sweet-settings"
path = "src/main.rs"

[dependencies]
serde_json = "1.0.154"
sha2 = "0.11.1"
sweet-engine = { path = "../engine" }
sweet-ui = { path = "../ui" }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3.0.12"
