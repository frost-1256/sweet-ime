name: 機能要望
description: 新機能・改善を提案する
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: 対象プラットフォーム
      description: 当てはまるものをすべて選んでください。
      multiple: true
      options:
        - 全プラットフォーム
        - Windows
        - Linux (fcitx5)
        - Android
        - macOS
        - 特になし
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 困っていること
      description: どんな場面で、何に困っているかを書いてください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 欲しい機能・改善
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案・今の回避策
      description: 今はどうやってしのいでいるか、他に考えた案があれば。
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 補足
    validations:
      required: false
