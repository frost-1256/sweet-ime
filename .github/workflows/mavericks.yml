name: Build Mavericks backport

on:
  push:
    branches: [backport/macos-10.9]
    tags: [backport/macos-10.9]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/backport/macos-10.9' || github.ref == 'refs/tags/backport/macos-10.9'
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: 1.100.0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Rust and LLVM linker
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target x86_64-apple-darwin
          brew install lld
          mkdir "$RUNNER_TEMP/mavericks-llvm"
          ln -s "$(xcrun --find clang)" "$RUNNER_TEMP/mavericks-llvm/clang"
          ln -s "$(xcrun --find llvm-objdump)" "$RUNNER_TEMP/mavericks-llvm/llvm-objdump"
          ln -s "$(brew --prefix lld)/bin/ld64.lld" "$RUNNER_TEMP/mavericks-llvm/ld64.lld"

      - name: Fetch and verify SDK archives
        env:
          SDK_BASE: https://github.com/phracker/MacOSX-SDKs/releases/download/11.3
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 -O "$SDK_BASE/MacOSX10.9.sdk.tar.xz"
          curl --fail --location --retry 3 -O "$SDK_BASE/MacOSX11.3.sdk.tar.xz"
          shasum -a 256 -c <<'CHECKSUMS'
          fcf88ce8ff0dd3248b97f4eb81c7909f2cc786725de277f4d05a2b935cc49de0  MacOSX10.9.sdk.tar.xz
          cd4f08a75577145b8f05245a2975f7c81401d75e9535dcffbb879ee1deefcbf4  MacOSX11.3.sdk.tar.xz
          CHECKSUMS
          tar -xf MacOSX10.9.sdk.tar.xz
          tar -xf MacOSX11.3.sdk.tar.xz

      - name: Link and verify the Mavericks executable
        shell: pwsh
        run: |
          ./macos/build-mavericks.ps1 -HeadersSdk "$env:RUNNER_TEMP/MacOSX11.3.sdk" `
            -MavericksSdk "$env:RUNNER_TEMP/MacOSX10.9.sdk" -LlvmBin "$env:RUNNER_TEMP/mavericks-llvm"

      - name: Archive the executable with its permissions
        run: tar -czf target/mavericks/SweetIME-Mavericks-x86_64.tar.gz -C target/mavericks SweetIME

      - name: Package and smoke-test the Mavericks input method
        run: |
          work=$(mktemp -d)
          curl --fail --location --retry 3 -o "$work/base.zip" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/v0.5.4/SweetIME-macOS.zip"
          ditto -x -k "$work/base.zip" "$work/base"
          app="$work/payload/Sweet IME.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          install -m 755 target/mavericks/SweetIME "$app/Contents/MacOS/SweetIME"
          cp macos/Info.plist "$app/Contents/Info.plist"
          plist="$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :LSMinimumSystemVersion 10.9' "$plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleVersion 0.5.4' "$plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 0.5.4' "$plist"
          plutil -lint "$plist"
          cp "$work/base/Sweet IME.app/Contents/Resources/"{system.dict,SweetIME.icns} "$app/Contents/Resources/"
          install -m 755 macos/install-mavericks.sh "$work/payload/Install Sweet IME.command"
          codesign --force --sign - "$app"
          codesign --verify --strict "$app"
          "$app/Contents/MacOS/SweetIME" --smoke-test
          ditto -c -k "$work/payload" target/mavericks/SweetIME-Mavericks.zip

      - uses: actions/upload-artifact@v7
        with:
          name: SweetIME-Mavericks-x86_64
          path: target/mavericks/SweetIME-Mavericks-x86_64.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: SweetIME-Mavericks-package
          path: target/mavericks/SweetIME-Mavericks.zip
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/tags/backport/macos-10.9'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: SweetIME-Mavericks-package
      - name: Publish the Mavericks prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" SweetIME-Mavericks.zip \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false \
            --title 'Sweet IME v0.5.4 – OS X 10.9 Mavericks (Preview)' --notes-file - <<'NOTES'
          v0.5.4 をベースにした Intel Mac 向けの Mavericks バックポートです。

          1. `SweetIME-Mavericks.zip` を展開します。
          2. `Install Sweet IME.command` を実行します。
          3. ログアウトして入り直し、システム環境設定の「キーボード」→「入力ソース」で Sweet IME を追加します。

          OS X 10.9 SDK でリンクし、Intel CI で基本変換を確認しました。Mavericks 実機での動作は未確認です。
          NOTES
