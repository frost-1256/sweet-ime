name: Verify release eligibility

# The tag ruleset requires this check on the tagged commit. Commits on
# develop pass too, for pre-release tags; the release job still requires
# main for tags without a hyphen.
on:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  eligibility:
    name: Release eligibility
    runs-on: ubuntu-24.04
    steps:
      - name: Verify the branch
        run: test "$GITHUB_REF" = refs/heads/main || test "$GITHUB_REF" = refs/heads/develop
