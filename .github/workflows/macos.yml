name: Build and test macOS

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: stable
  MOZC_REF: 1527a4cd1217cec4611cd4bc8d46f8c66ea79e6a

jobs:
  package:
    name: Build and test the universal macOS bundle
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: google/mozc
          ref: ${{ env.MOZC_REF }}
          path: third_party/mozc-data
          sparse-checkout: src/data/dictionary_oss
          persist-credentials: false
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main saves: tag and PR runs restore its caches instead of
          # filling the 10 GB quota with copies that evict them.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache the system dictionary
        id: dict-cache
        uses: actions/cache@v4
        with:
          path: data/system.dict
          key: dict-v1-${{ env.MOZC_REF }}-${{ hashFiles('scripts/build-dictionary.ps1', 'scripts/fetch-sudachidict.ps1', 'crates/dictc/**', 'crates/engine/src/dict.rs', 'crates/engine/src/romaji.rs', 'crates/engine/src/*.tsv') }}
          enableCrossOsArchive: true
      - name: Build the system dictionary
        if: steps.dict-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/build-dictionary.ps1 -Output data/system.dict
      - run: cargo test --locked -p sweet-macos -p sweet-settings -p sweet-zenz -- --test-threads=1
      - run: bash macos/build.sh
      - name: Smoke test the universal bundle on macos-15
        run: |
          stage="$RUNNER_TEMP/macos-smoke"
          rm -rf "$stage"
          mkdir -p "$stage"
          ditto -x -k out/SweetIME-macOS.zip "$stage"
          codesign --verify --deep --strict "$stage/Sweet IME.app"
          "$stage/Sweet IME.app/Contents/MacOS/SweetIME" --smoke-test
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 "$stage/Sweet IME.app/Contents/MacOS/SweetIME" --smoke-test
          fi
          "$stage/Sweet IME.app/Contents/MacOS/SweetIME" --candidate-panel-preview macOS-candidates.png
      - name: Verify first install, replacement and invalid bundle rejection
        run: |
          stage="$RUNNER_TEMP/macos-smoke"
          export SWEET_IME_INPUT_METHODS_DIR="$RUNNER_TEMP/installer test/Input Methods"
          target="$SWEET_IME_INPUT_METHODS_DIR/Sweet IME.app"
          test -x "$stage/Install Sweet IME.command"
          (cd "$stage" && "./Install Sweet IME.command")
          codesign --verify --deep --strict "$target"
          touch "$target/Contents/Resources/previous-install"
          bash macos/install.sh --archive out/SweetIME-macOS.zip
          test ! -e "$target/Contents/Resources/previous-install"
          codesign --verify --deep --strict "$target"
          cp -R "$stage/Sweet IME.app" "$RUNNER_TEMP/tampered.app"
          printf 'invalid' > "$RUNNER_TEMP/tampered.app/Contents/Resources/system.dict"
          if bash macos/install.sh --bundle "$RUNNER_TEMP/tampered.app"; then
            echo "Installer accepted a modified bundle" >&2
            exit 1
          fi
          codesign --verify --deep --strict "$target"
          test ! -e "$SWEET_IME_INPUT_METHODS_DIR/.sweet-ime-install"
          (
            exec 9>>"$SWEET_IME_INPUT_METHODS_DIR/.sweet-ime-install.lock"
            /usr/bin/perl -MFcntl=:flock -e 'flock(STDIN, LOCK_EX | LOCK_NB) or exit 1' <&9
            if bash macos/install.sh --archive out/SweetIME-macOS.zip; then
              echo "Installer ignored another process's lock" >&2
              exit 1
            fi
          )
          work="$SWEET_IME_INPUT_METHODS_DIR/.sweet-ime-install"
          mkdir "$work"
          mv "$target" "$work/previous.app"
          if bash macos/install.sh --bundle "$RUNNER_TEMP/tampered.app"; then
            echo "Installer accepted a modified bundle during recovery" >&2
            exit 1
          fi
          codesign --verify --deep --strict "$target"
          test ! -e "$work"
          bash macos/install.sh --archive out/SweetIME-macOS.zip
          codesign --verify --deep --strict "$target"
          mkdir -p "$work/previous.app/Contents"
          bash macos/install.sh --archive out/SweetIME-macOS.zip
          test ! -e "$work"
          codesign --verify --deep --strict "$target"
      - uses: actions/upload-artifact@v7
        with:
          name: SweetIME-macOS
          path: out/SweetIME-macOS.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: macOS-candidate-panel
          path: macOS-candidates.png
          if-no-files-found: error

  smoke-intel:
    name: Smoke test on macos-15-intel
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: package
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main saves: tag and PR runs restore its caches instead of
          # filling the 10 GB quota with copies that evict them.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked -p sweet-zenz --lib
      - uses: actions/download-artifact@v8
        with:
          name: SweetIME-macOS
      - run: |
          ditto -x -k SweetIME-macOS.zip .
          codesign --verify --deep --strict "Sweet IME.app"
          "Sweet IME.app/Contents/MacOS/SweetIME" --smoke-test
