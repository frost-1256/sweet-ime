name: Build, test and release

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: stable
  MOZC_REF: 1527a4cd1217cec4611cd4bc8d46f8c66ea79e6a

jobs:
  changes:
    name: Detect affected platforms
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      windows: ${{ steps.filter.outputs.windows }}
      test: ${{ steps.filter.outputs.test }}
      android: ${{ steps.filter.outputs.android }}
      linux: ${{ steps.filter.outputs.linux }}
      macos: ${{ steps.filter.outputs.macos }}
    steps:
      - name: Check out PR merge commit
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Classify changed paths
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          all_true() {
            {
              echo "windows=true"
              echo "test=true"
              echo "android=true"
              echo "linux=true"
              echo "macos=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            all_true
          fi
          if ! git rev-parse --verify HEAD^1 >/dev/null 2>&1; then
            all_true
          fi

          win=false
          tst=false
          and=false
          lnx=false
          mac=false

          while IFS= read -r -d '' f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md|docs/*|eval/*|.gitignore|LICENSE*)
                ;;
              Cargo.toml|*/Cargo.toml|Cargo.lock|crates/engine/*|crates/zenz/*|crates/dictc/*|crates/ui/*|scripts/build-dictionary.ps1|scripts/fetch-sudachidict.ps1|.github/workflows/windows.yml)
                win=true; tst=true; and=true; lnx=true; mac=true
                ;;
              crates/tsf/*|crates/tsf-shim/*|crates/installer/*)
                win=true; tst=true
                ;;
              scripts/build.ps1|scripts/get-zenz.ps1)
                win=true
                ;;
              crates/android/*)
                and=true; tst=true
                ;;
              android/*)
                and=true
                ;;
              crates/fcitx5/*)
                lnx=true; tst=true
                ;;
              nix/*|flake.nix|flake.lock|scripts/package-linux.sh)
                lnx=true
                ;;
              crates/macos/*)
                mac=true; tst=true
                ;;
              macos/*|.github/workflows/macos.yml)
                mac=true
                ;;
              crates/settings/*)
                win=true; lnx=true; mac=true; tst=true
                ;;
              crates/cli/*)
                tst=true
                ;;
              assets/*)
                win=true; and=true; lnx=true; mac=true
                ;;
              crates/*)
                win=true; tst=true; and=true; lnx=true; mac=true
                ;;
              *)
                win=true; tst=true; and=true; lnx=true; mac=true
                ;;
            esac
          done < <(git diff -z --name-only --no-renames HEAD^1 HEAD)

          {
            echo "windows=$win"
            echo "test=$tst"
            echo "android=$and"
            echo "linux=$lnx"
            echo "macos=$mac"
          } >> "$GITHUB_OUTPUT"
          echo "Detected: windows=$win test=$tst android=$and linux=$lnx macos=$mac"

  windows:
    name: Build the installer
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      # Job-wide so the TSF harness build reuses the engine compiled for the
      # installer instead of rebuilding it for a changed option_env!.
      SWEET_IME_ALPHA_FEEDBACK_URL: ${{ vars.SWEET_IME_ALPHA_FEEDBACK_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out the Mozc dictionary
        uses: actions/checkout@v7
        with:
          repository: google/mozc
          ref: ${{ env.MOZC_REF }}
          path: third_party/mozc-data
          sparse-checkout: src/data/dictionary_oss
          persist-credentials: false

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --target i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          # Only main saves: tag and PR runs restore its caches instead of
          # filling the 10 GB quota with copies that evict them.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache the system dictionary
        id: dict-cache
        uses: actions/cache@v4
        with:
          path: data/system.dict
          key: dict-v1-${{ env.MOZC_REF }}-${{ hashFiles('scripts/build-dictionary.ps1', 'scripts/fetch-sudachidict.ps1', 'crates/dictc/**', 'crates/engine/src/dict.rs', 'crates/engine/src/romaji.rs', 'crates/engine/src/*.tsv') }}
          enableCrossOsArchive: true

      - name: Build the system dictionary
        if: steps.dict-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-dictionary.ps1 -Output data/system.dict

      - name: Build and verify the installer
        run: ./scripts/build.ps1 -Dictionary data/system.dict

      - name: Cache the zenz model
        id: zenz-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/zenz.swz
          key: zenz-v1-xsmall-${{ hashFiles('scripts/get-zenz.ps1', 'crates/zenz/**') }}

      - name: Run the Windows TSF harness
        run: |
          $env:SWEET_IME_DICT = (Resolve-Path dist/system.dict).Path
          $env:SWEET_IME_ZENZ = Join-Path $env:RUNNER_TEMP 'zenz.swz'
          if (-not (Test-Path -LiteralPath $env:SWEET_IME_ZENZ)) {
            ./scripts/get-zenz.ps1 -Out $env:SWEET_IME_ZENZ
          }
          # Same package set as scripts/build.ps1, so Cargo resolves the same
          # features and reuses the installer's release artifacts.
          cargo build --locked --release -p sweet-tsf -p sweet-tsf-shim -p sweet-zenz -p sweet-settings -p sweet-installer --example harness
          if ($LASTEXITCODE) { throw 'harness build failed' }
          ./target/release/examples/harness.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $searchHarness = Join-Path $env:RUNNER_TEMP 'SearchHost.exe'
          Copy-Item target/release/examples/harness.exe $searchHarness
          $env:SWEET_TEST_SEARCH_HOST = '1'
          & $searchHarness

      - name: Store the installer
        uses: actions/upload-artifact@v7
        with:
          name: SweetIME-Windows
          path: out/SweetIME-Setup.exe
          if-no-files-found: error

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Cache the system dictionary
        id: dict-cache
        uses: actions/cache@v4
        with:
          path: data/system.dict
          key: dict-v1-${{ env.MOZC_REF }}-${{ hashFiles('scripts/build-dictionary.ps1', 'scripts/fetch-sudachidict.ps1', 'crates/dictc/**', 'crates/engine/src/dict.rs', 'crates/engine/src/romaji.rs', 'crates/engine/src/*.tsv') }}
          enableCrossOsArchive: true

      - name: Check out the Mozc dictionary
        if: steps.dict-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: google/mozc
          ref: ${{ env.MOZC_REF }}
          path: third_party/mozc-data
          sparse-checkout: src/data/dictionary_oss
          persist-credentials: false

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          # Only main saves: tag and PR runs restore its caches instead of
          # filling the 10 GB quota with copies that evict them.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the system dictionary
        if: steps.dict-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-dictionary.ps1 -Output data/system.dict

      - name: Test the workspace with the system dictionary
        # Typo correction uses a short wall-clock budget. Avoid CPU contention
        # between dictionary-backed tests on hosted runners.
        run: cargo test --locked --workspace --all-targets -- --test-threads=1

  android:
    name: Build the APK
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Cache the system dictionary
        id: dict-cache
        uses: actions/cache@v4
        with:
          path: data/system.dict
          key: dict-v1-${{ env.MOZC_REF }}-${{ hashFiles('scripts/build-dictionary.ps1', 'scripts/fetch-sudachidict.ps1', 'crates/dictc/**', 'crates/engine/src/dict.rs', 'crates/engine/src/romaji.rs', 'crates/engine/src/*.tsv') }}
          enableCrossOsArchive: true

      - name: Check out the Mozc dictionary
        if: steps.dict-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: google/mozc
          ref: ${{ env.MOZC_REF }}
          path: third_party/mozc-data
          sparse-checkout: src/data/dictionary_oss
          persist-credentials: false

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --target aarch64-linux-android --target x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          # Only main saves: tag and PR runs restore its caches instead of
          # filling the 10 GB quota with copies that evict them.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the system dictionary
        if: steps.dict-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-dictionary.ps1 -Output data/system.dict

      - name: Build the Android APK
        env:
          KEYSTORE_B64: ${{ secrets.SWEET_ANDROID_KEYSTORE_B64 }}
          SWEET_ANDROID_KEYSTORE_PASS: ${{ secrets.SWEET_ANDROID_KEYSTORE_PASS }}
          SWEET_IME_ALPHA_FEEDBACK_URL: ${{ vars.SWEET_IME_ALPHA_FEEDBACK_URL }}
        run: |
          # Kept in the Rust cache (~/.cargo/bin): installed once.
          if (-not (Get-Command cargo-ndk -ErrorAction SilentlyContinue)) {
            cargo install cargo-ndk --locked --version 4.1.2
          }
          $platform = Join-Path $env:ANDROID_HOME 'platforms\android-36\android.jar'
          $buildTools = Join-Path $env:ANDROID_HOME 'build-tools\36.0.0'
          if (-not ((Test-Path -LiteralPath $platform) -and (Test-Path -LiteralPath $buildTools))) {
            $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools\latest\bin\sdkmanager.bat'
            & $sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' | Out-Null
          }
          $env:ANDROID_NDK_HOME = $env:ANDROID_NDK_LATEST_HOME
          $env:JAVA_HOME = $env:JAVA_HOME_17_X64
          if ($env:KEYSTORE_B64) {
            $ks = Join-Path $env:RUNNER_TEMP 'release.jks'
            [IO.File]::WriteAllBytes($ks, [Convert]::FromBase64String($env:KEYSTORE_B64))
            $env:SWEET_ANDROID_KEYSTORE = $ks
          }
          ./android/build.ps1 -Dictionary data/system.dict

      - name: Store the APK
        uses: actions/upload-artifact@v7
        with:
          name: SweetIME-Android
          path: out/SweetIME-Android.apk
          if-no-files-found: error

  android-smoke:
    name: Test the APK on Android
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: SweetIME-Android
          path: out

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-android-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and start Sweet IME
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          script: bash android/tests/smoke.sh out/SweetIME-Android.apk

  linux:
    name: Test fcitx5 (${{ matrix.arch }})
    needs: changes
    # Always expand the matrix so both required checks run for every PR.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0

      - name: Enable the public Cachix cache
        id: cachix
        if: vars.CACHIX_CACHE_NAME != ''
        continue-on-error: true
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          skipPush: 'true'

      - name: Build the Linux package
        run: nix build -L

      - name: Run the fcitx5 D-Bus harness
        run: nix develop --command sh crates/fcitx5/tests/run-dbus-harness.sh result

      - name: Publish the tested Linux package to Cachix
        if: github.event_name == 'push' && steps.cachix.outcome == 'success'
        continue-on-error: true
        env:
          CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -n "$CACHIX_AUTH_TOKEN" ]; then
            cachix push "$CACHIX_CACHE_NAME" ./result
          fi

  linux-package:
    name: Package Linux (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out the Mozc dictionary
        uses: actions/checkout@v7
        with:
          repository: google/mozc
          ref: ${{ env.MOZC_REF }}
          path: third_party/mozc-data
          sparse-checkout: src/data/dictionary_oss
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config unzip curl libfcitx5core-dev fcitx5-modules-dev \
            libcairo2-dev libpango1.0-dev libwayland-bin libxcb-ewmh-dev \
            libfontconfig1-dev libwayland-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev libx11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: Swatinem/rust-cache@v2
        with:
          # Only main saves: tag and PR runs restore its caches instead of
          # filling the 10 GB quota with copies that evict them.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache the system dictionary
        id: dict-cache
        uses: actions/cache@v4
        with:
          path: data/system.dict
          key: dict-v1-${{ env.MOZC_REF }}-${{ hashFiles('scripts/build-dictionary.ps1', 'scripts/fetch-sudachidict.ps1', 'crates/dictc/**', 'crates/engine/src/dict.rs', 'crates/engine/src/romaji.rs', 'crates/engine/src/*.tsv') }}
          enableCrossOsArchive: true

      - name: Build the Linux binary archive
        run: bash scripts/package-linux.sh "${{ matrix.arch }}" "out/SweetIME-Linux-${{ matrix.arch }}.tar.gz"

      - name: Store the Linux package
        uses: actions/upload-artifact@v7
        with:
          name: SweetIME-Linux-${{ matrix.arch }}
          path: out/SweetIME-Linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  macos:
    name: Test macOS
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    uses: ./.github/workflows/macos.yml

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [windows, test, android-smoke, linux, linux-package, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # A pre-release tag (with a hyphen, such as v1.0.0-alpha.1) may also
      # come from develop. Other releases must be on main.
      - name: Require the tagged commit to be on main, or develop for a pre-release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            exit 0
          fi
          if [[ "$RELEASE_TAG" == *-* ]] && git merge-base --is-ancestor "$GITHUB_SHA" origin/develop; then
            exit 0
          fi
          echo "::error::$RELEASE_TAG must point to a commit on main (or on develop for a pre-release tag)."
          exit 1

      - uses: actions/download-artifact@v8
        with:
          name: SweetIME-Windows
          path: out

      - uses: actions/download-artifact@v8
        with:
          name: SweetIME-Android
          path: out

      - uses: actions/download-artifact@v8
        with:
          name: SweetIME-macOS
          path: out

      - uses: actions/download-artifact@v8
        with:
          name: SweetIME-Linux-x86_64
          path: out

      - uses: actions/download-artifact@v8
        with:
          name: SweetIME-Linux-aarch64
          path: out

      - name: Attach the release packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          files=(
            out/SweetIME-Setup.exe
            out/SweetIME-Android.apk
            out/SweetIME-macOS.zip
            out/SweetIME-Linux-x86_64.tar.gz
            out/SweetIME-Linux-aarch64.tar.gz
          )
          tag_ref="refs/tags/$RELEASE_TAG"
          notes=""
          if [[ "$(git cat-file -t "$tag_ref")" == tag ]]; then
            notes=$(git for-each-ref --format='%(contents:body)' "$tag_ref")
          fi

          if assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name'); then
            if [[ -n "$notes" ]]; then
              body=$(gh release view "$RELEASE_TAG" --json body --jq '.body // ""')
              if [[ "$body" != "$notes" && "$body" != "$notes"$'\n'* ]]; then
                body="$notes${body:+$'\n\n'$body}"
                gh release edit "$RELEASE_TAG" --notes "$body"
              fi
            fi
            for f in "${files[@]}"; do
              if ! grep -Fxq "$(basename "$f")" <<< "$assets"; then
                gh release upload "$RELEASE_TAG" "$f"
              fi
            done
          else
            args=(--verify-tag --generate-notes)
            if [[ -n "$notes" ]]; then
              args+=(--notes "$notes")
            fi
            if [[ "$RELEASE_TAG" == *-* ]]; then
              args+=(--prerelease --latest=false)
            fi
            gh release create "$RELEASE_TAG" "${files[@]}" "${args[@]}"
          fi
