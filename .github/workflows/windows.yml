name: Build, test and release

on:
  push:
    branches: [main, develop]
    tags: ['v[0-9]*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: stable
  MOZC_REF: 1527a4cd1217cec4611cd4bc8d46f8c66ea79e6a

jobs:
  windows:
    name: Build the installer
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out the Mozc dictionary
        uses: actions/checkout@v7
        with:
          repository: google/mozc
          ref: ${{ env.MOZC_REF }}
          path: third_party/mozc-data
          sparse-checkout: src/data/dictionary_oss
          persist-credentials: false

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --target i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Build and verify the installer
        run: ./scripts/build.ps1

      - name: Run the Windows TSF harness
        run: |
          $env:SWEET_IME_DICT = (Resolve-Path dist/system.dict).Path
          $env:SWEET_IME_ZENZ = Join-Path $env:RUNNER_TEMP 'zenz.swz'
          ./scripts/get-zenz.ps1 -Out $env:SWEET_IME_ZENZ
          cargo run --locked --release -p sweet-tsf --example harness

      - name: Store the installer
        uses: actions/upload-artifact@v7
        with:
          name: SweetIME-Windows
          path: out/SweetIME-Setup.exe
          if-no-files-found: error

  test:
    name: Test
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out the Mozc dictionary
        uses: actions/checkout@v7
        with:
          repository: google/mozc
          ref: ${{ env.MOZC_REF }}
          path: third_party/mozc-data
          sparse-checkout: src/data/dictionary_oss
          persist-credentials: false

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Build the system dictionary
        run: ./scripts/build-dictionary.ps1 -Output data/system.dict

      - name: Test the workspace with the system dictionary
        run: cargo test --locked --workspace --all-targets

  android:
    name: Build the APK
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out the Mozc dictionary
        uses: actions/checkout@v7
        with:
          repository: google/mozc
          ref: ${{ env.MOZC_REF }}
          path: third_party/mozc-data
          sparse-checkout: src/data/dictionary_oss
          persist-credentials: false

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --target aarch64-linux-android --target x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Build the Android APK
        env:
          KEYSTORE_B64: ${{ secrets.SWEET_ANDROID_KEYSTORE_B64 }}
          SWEET_ANDROID_KEYSTORE_PASS: ${{ secrets.SWEET_ANDROID_KEYSTORE_PASS }}
        run: |
          # Kept in the Rust cache (~/.cargo/bin): installed once.
          cargo install cargo-ndk --locked --version 4.1.2
          $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools\latest\bin\sdkmanager.bat'
          & $sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' | Out-Null
          $env:ANDROID_NDK_HOME = $env:ANDROID_NDK_LATEST_HOME
          $env:JAVA_HOME = $env:JAVA_HOME_17_X64
          if ($env:KEYSTORE_B64) {
            $ks = Join-Path $env:RUNNER_TEMP 'release.jks'
            [IO.File]::WriteAllBytes($ks, [Convert]::FromBase64String($env:KEYSTORE_B64))
            $env:SWEET_ANDROID_KEYSTORE = $ks
          }
          ./android/build.ps1

      - name: Store the APK
        uses: actions/upload-artifact@v7
        with:
          name: SweetIME-Android
          path: out/SweetIME-Android.apk
          if-no-files-found: error

  android-smoke:
    name: Test the APK on Android
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: SweetIME-Android
          path: out

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-android-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and start Sweet IME
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          script: bash android/tests/smoke.sh out/SweetIME-Android.apk

  linux:
    name: Test fcitx5 (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0

      - name: Build the Linux package
        run: nix build -L

      - name: Run the fcitx5 D-Bus harness
        run: nix develop --command sh crates/fcitx5/tests/run-dbus-harness.sh result

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [windows, test, android-smoke, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tagged commit to be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/download-artifact@v8
        with:
          name: SweetIME-Windows
          path: out

      - uses: actions/download-artifact@v8
        with:
          name: SweetIME-Android
          path: out

      - name: Attach the installer and the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          files=(out/SweetIME-Setup.exe out/SweetIME-Android.apk)
          if assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name'); then
            for f in "${files[@]}"; do
              if ! grep -Fxq "$(basename "$f")" <<< "$assets"; then
                gh release upload "$RELEASE_TAG" "$f"
              fi
            done
          else
            args=(--verify-tag --generate-notes)
            if [[ "$RELEASE_TAG" == *-* ]]; then
              args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${files[@]}" "${args[@]}"
          fi
