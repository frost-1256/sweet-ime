[workspace]
resolver = "3"
members = ["crates/engine", "crates/dictc", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
fst = "0.4"
memmap2 = "0.9"
regex = "1"
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
